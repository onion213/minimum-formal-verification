name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install hax
        run: cargo install --locked cargo-hax --version 0.4.2
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download Lean dependencies
        working-directory: proofs/lean
        run: lake exe cache get
      - name: Verify implementation and proofs
        run: bash scripts/verify.sh
      - name: Check that broken implementations fail their proofs
        run: python3 scripts/check_mutations.py
